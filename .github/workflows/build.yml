name: Build .app

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build .app (ad-hoc signed, Release)
        run: |
          set -euo pipefail
          xcodebuild \
            -project JMVoicing.xcodeproj \
            -scheme JMVoicing \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Locate .app
        id: locate
        run: |
          APP=$(find build/Build/Products/Release -maxdepth 2 -name "JMVoicing.app" -print -quit)
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "Found: $APP"

      - name: Ad-hoc sign with hardened runtime + entitlements
        run: |
          codesign --force --deep --sign - \
            --entitlements JMVoicing/JMVoicing.entitlements \
            --options runtime \
            "${{ steps.locate.outputs.app }}"
          codesign --verify --verbose=2 "${{ steps.locate.outputs.app }}"

      - name: Verify app structure
        run: |
          set -euo pipefail
          APP="${{ steps.locate.outputs.app }}"
          PLIST="$APP/Contents/Info.plist"
          EXEC="$APP/Contents/MacOS/JMVoicing"
          echo "=== Architecture ==="
          lipo -info "$EXEC"
          echo "=== Info.plist ==="
          /usr/libexec/PlistBuddy -c Print "$PLIST"
          echo "=== Required keys ==="
          for key in CFBundleIdentifier CFBundleExecutable LSMinimumSystemVersion LSUIElement NSMicrophoneUsageDescription NSSpeechRecognitionUsageDescription; do
            value=$(/usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" 2>/dev/null || echo "MISSING")
            echo "  $key = $value"
            if [ "$value" = "MISSING" ]; then
              echo "::error::Required Info.plist key missing: $key"
              exit 1
            fi
          done
          echo "=== Entitlements ==="
          codesign -d --entitlements - "$APP" 2>&1 | tail -n 20
          echo "=== App structure OK ==="

      - name: Smoke-test launch
        continue-on-error: true
        run: |
          set -uo pipefail
          APP="${{ steps.locate.outputs.app }}"
          EXEC="$APP/Contents/MacOS/JMVoicing"
          if [ ! -x "$EXEC" ]; then
            echo "::error::Executable not found at $EXEC"
            exit 1
          fi
          echo "Launching $EXEC for 4 seconds to verify it doesn't crash on startup..."
          "$EXEC" > /tmp/jm-smoke.log 2>&1 &
          PID=$!
          sleep 4
          if kill -0 "$PID" 2>/dev/null; then
            echo "✓ App still running after 4s — launch path is OK."
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            STATUS="alive"
          else
            wait "$PID" 2>/dev/null
            RC=$?
            echo "::warning::App exited within 4s with code $RC"
            STATUS="exited:$RC"
          fi
          echo "--- launch log (last 60 lines) ---"
          tail -n 60 /tmp/jm-smoke.log || true
          echo "--- end log ---"
          echo "Smoke test result: $STATUS"

      - name: Zip
        run: |
          cd "$(dirname '${{ steps.locate.outputs.app }}')"
          ditto -c -k --sequesterRsrc --keepParent JMVoicing.app "$GITHUB_WORKSPACE/JMVoicing.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JMVoicing-app
          path: JMVoicing.zip
          retention-days: 90

      - name: Attach to release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: JMVoicing.zip
          generate_release_notes: true
