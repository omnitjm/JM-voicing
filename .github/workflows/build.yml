name: Build apps

on:
  push:
    branches: [main, claude/voice-dictation-mac-pcebx]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build .app (ad-hoc signed, Release)
        run: |
          set -euo pipefail
          xcodebuild \
            -project OmnitGram.xcodeproj \
            -scheme OmnitGram \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Locate .app
        id: locate
        run: |
          APP=$(find build/Build/Products/Release -maxdepth 2 -name "OmnitGram.app" -print -quit)
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "Found: $APP"

      - name: Ad-hoc sign with hardened runtime + entitlements
        run: |
          codesign --force --deep --sign - \
            --entitlements OmnitGram/OmnitGram.entitlements \
            --options runtime \
            "${{ steps.locate.outputs.app }}"
          codesign --verify --verbose=2 "${{ steps.locate.outputs.app }}"

      - name: Smoke test - app launches and stays alive
        run: |
          set -euo pipefail
          "${{ steps.locate.outputs.app }}/Contents/MacOS/OmnitGram" &
          PID=$!
          sleep 10
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::OmnitGram.app died within 10s of launch"
            exit 1
          fi
          echo "App alive after 10s - OK"
          kill "$PID" || true

      - name: Build E2E tool (shares production SelectionService/TextInserter)
        run: |
          set -euo pipefail
          xcodebuild \
            -project OmnitGram.xcodeproj \
            -scheme OmnitGramE2E \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          codesign --force --sign - build/Build/Products/Release/OmnitGramE2E

      - name: Grant Accessibility to E2E tool (runner has SIP disabled)
        run: |
          BIN="$PWD/build/Build/Products/Release/OmnitGramE2E"
          sudo python3 - "$BIN" <<'PY' || echo "::warning::TCC grant failed - E2E will self-skip"
          import sqlite3, sys, time
          db = "/Library/Application Support/com.apple.TCC/TCC.db"
          binpath = sys.argv[1]
          conn = sqlite3.connect(db)
          cols = [r[1] for r in conn.execute("PRAGMA table_info(access)")]
          known = {
              "service": "kTCCServiceAccessibility",
              "client": binpath,
              "client_type": 1,  # 1 = path (unbundled binary)
              "auth_value": 2,   # 2 = allowed
              "auth_reason": 4,
              "auth_version": 1,
              "indirect_object_identifier": "UNUSED",
              "indirect_object_identifier_type": 0,
              "flags": 0,
              "last_modified": int(time.time()),
          }
          row = [known.get(c) for c in cols]
          ph = ",".join("?" for _ in cols)
          conn.execute(f"INSERT OR REPLACE INTO access ({','.join(cols)}) VALUES ({ph})", row)
          conn.commit()
          print(f"Granted accessibility to {binpath}")
          PY
          sudo pkill -f tccd || true
          sleep 2

      - name: E2E test - real Cmd+C/Cmd+V through the OS against a live NSTextView
        run: ./build/Build/Products/Release/OmnitGramE2E

      - name: Zip
        run: |
          cd "$(dirname '${{ steps.locate.outputs.app }}')"
          ditto -c -k --sequesterRsrc --keepParent OmnitGram.app "$GITHUB_WORKSPACE/OmnitGram-mac.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmnitGram-mac
          path: OmnitGram-mac.zip
          retention-days: 90

      - name: Attach to release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OmnitGram-mac.zip
          generate_release_notes: true

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements.txt pyinstaller

      - name: Run logic tests
        run: python windows/test_omnitgram.py

      - name: E2E test - real Ctrl+C/Ctrl+V through the OS against a live text field
        run: python windows/e2e_clipboard_test.py

      - name: E2E test - preview window accepts via real Enter keypress
        run: python windows/e2e_preview_test.py

      - name: Build OmnitGram.exe
        run: |
          pyinstaller --onefile --noconsole --name OmnitGram windows/omnitgram.py

      - name: Smoke test - exe launches and stays alive
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/OmnitGram.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) {
            Write-Error "OmnitGram.exe exited within 12s of launch (exit code $($p.ExitCode))"
            exit 1
          }
          Write-Output "Exe alive after 12s - OK"
          Stop-Process -Id $p.Id -Force

      - name: Zip
        run: Compress-Archive -Path dist/OmnitGram.exe -DestinationPath OmnitGram-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmnitGram-windows
          path: OmnitGram-windows.zip
          retention-days: 90

      - name: Attach to release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OmnitGram-windows.zip
          generate_release_notes: true
