name: OmnitGram
options:
  bundleIdPrefix: com.omnit
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
targets:
  OmnitGram:
    type: application
    platform: macOS
    sources:
      - path: OmnitGram
        excludes:
          - "Info.plist"
          - "OmnitGram.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omnit.omnitgram
        INFOPLIST_FILE: OmnitGram/Info.plist
        CODE_SIGN_ENTITLEMENTS: OmnitGram/OmnitGram.entitlements
        ENABLE_APP_SANDBOX: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    scheme: {}

  # CLI-testværktøj der deler produktions-koden for OS-integrationslaget.
  OmnitGramE2E:
    type: tool
    platform: macOS
    sources:
      - path: mac-tests
      - path: OmnitGram/Managers/SelectionService.swift
      - path: OmnitGram/Managers/TextInserter.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omnit.omnitgram.e2e
    scheme: {}
